[project]
name = "ciatadel-backend"
version = "0.1.0"
description = "cIAtadel — secure multi-tenant AI workspace (POC backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "security: tenant-isolation and abuse-case tests",
    "integration: tests requiring the full docker stack (postgres, minio, ollama)",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
