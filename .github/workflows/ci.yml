name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ciatadel_test
          POSTGRES_USER: ciatadel
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ciatadel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://ciatadel:ci-only-password@localhost:5432/ciatadel_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://localhost:8000

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: fmt + validate (no AWS credentials, nothing applied)
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.9 fmt -check -recursive
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf/environments/dev hashicorp/terraform:1.9 init -backend=false -input=false
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf/environments/dev hashicorp/terraform:1.9 validate

  e2e:
    # Full docker compose stack (Django, Celery, Postgres+pgvector+RLS, MinIO,
    # Redis, Next.js) with deterministic fake AI providers; no GPU or model
    # download needed. The real-LLM path is exercised locally (see README).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/setup-env.sh
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          E2E_FAKE_LLM: "1"
      - if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: |
            compose-logs.txt
            frontend/playwright-report/
            frontend/test-results/
