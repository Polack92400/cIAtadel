# cIAtadel — local stack.
#
#   ./scripts/setup-env.sh        # once: creates .env with random secrets
#   docker compose up --build     # then open http://localhost:3000
#
# Only the frontend is published, and only on 127.0.0.1. Every other service
# lives on the internal `backend` network (no route to the internet), except
# Ollama, which also joins `egress` to download models.

name: ciatadel

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: ciatadel-backend:local
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LLM_BASE_URL: http://ollama:11434
    EMBEDDING_BASE_URL: http://ollama:11434
  networks: [backend]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  minio:
    # Upstream MinIO no longer publishes images on Docker Hub; this is the
    # MinIO server packaged by Bitnami. Override with MINIO_IMAGE if needed.
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
      # Static KMS key -> objects are encrypted at rest (SSE). On AWS: SSE-KMS.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.14}
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [backend, egress]
    restart: unless-stopped

  # One-shot: downloads the configured models (first run only, ~2.5 GB).
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$$LLM_MODEL" && ollama pull "$$EMBEDDING_MODEL" && echo "models ready"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      ollama: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  # One-shot: migrations (as owner), bucket creation, demo data.
  init:
    <<: *backend
    command: ["docker/init.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      init: { condition: service_completed_successfully }
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5).status != 200)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    command: ["docker/start-worker.sh"]
    depends_on:
      init: { condition: service_completed_successfully }
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker@$$HOSTNAME -t 5 >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    image: ciatadel-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend, edge]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge: {}
  egress: {}

volumes:
  postgres-data:
  minio-data:
  ollama-data:
